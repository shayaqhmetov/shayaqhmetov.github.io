name: Build & Deploy static site to gh-pages

on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

env:
  SITE_URL: https://shayaqhmetov.github.io

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate pages from src/content.json
        run: python3 src/build.py

      - name: Fail if committed HTML is stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated files differ from what is committed."
            echo "Run: SITE_URL=$SITE_URL python3 src/build.py — then commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Assemble publish directory
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.claude/' \
            --exclude '_site/' \
            --exclude 'src/' \
            --exclude 'README.md' \
            --exclude '.gitignore' \
            --exclude 'ngrok' \
            --exclude '*.zip' \
            ./ _site/
          ls -R _site

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GH_PAT }}
          publish_dir: _site
          publish_branch: gh-pages
          enable_jekyll: false
          force_orphan: true
          # cname: yourdomain.com  # if a custom domain is added later
